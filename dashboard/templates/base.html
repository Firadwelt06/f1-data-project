<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}F1 Data Engineering Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Plotly loaded globally now, even though 6a has no charts yet —
         6b and 6c will both need it, and one CDN include here is simpler
         than adding it per-template later. -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
    <nav class="topnav">
        <a href="{{ url_for('main.index') }}" class="brand">F1 Data Project</a>
        <div class="nav-links">
            <a href="{{ url_for('analytics.index') }}" class="nav-link">Analytics</a>
            <a href="{{ url_for('predictions.index') }}" class="nav-link">Predictions</a>
        </div>
    </nav>

    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
